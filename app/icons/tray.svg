  <ellipse cx="24" cy="16.2" rx="19" ry="8.6" fill="url(#base)" stroke="#9aa2ab" stroke-width=".8"/>
  <ellipse cx="24" cy="15.4" rx="11" ry="4.2" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width=".8"/>

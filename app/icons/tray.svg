<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/><stop offset=".55" stop-color="#b9c0c8"/><stop offset="1" stop-color="#8b939c"/>
    </linearGradient>
    <radialGradient id="base" cx=".5" cy=".45" r=".6">
